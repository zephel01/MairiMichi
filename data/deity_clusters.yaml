# MairiMichi 神格クラスタ v1（Phase 1 シード）
#
# なぜ必要か:
#   Wikidata では同一の信仰対象が別QIDに分裂している。
#     八幡神 Q261637(1,741) ⇔ 応神天皇 Q317997(334)
#     稲荷神 Q719665(1,154) ⇔ ウカノミタマ Q3080728(157)
#     天満大自在天神 Q1753428(655) ⇔ 菅原道真 Q382005(170)
#     素戔嗚尊 Q272993(1,003) ⇔ 牛頭天王 Q11570247(580)
#     観音は 6分裂（十一面387/聖観音273/千手262/観世音185/如意輪98/観音菩薩46）
#   さらに ja.Wikipedia infobox の祭神は 41.2% がパイプ付きリンク、40.7% が
#   リンクなし素テキストで、表記ゆれが常態。
#
# 効果（400社サンプルでの実測）:
#   素朴な40エントリ辞書        → 165社 (41.2%)
#   ＋素テキスト照合             → 195社 (48.8%)
#   27クラスタ＋別名辞書に再設計 → 274社 (68.5%)   ★
#
# 突合の優先順:
#   1. Wikidata QID 完全一致
#   2. ja.Wikipedia のリンク先記事名 完全一致（表示名ではなくリンク先を使う）
#   3. aliases への正規化後の文字列一致
#   4. 一致しなければ cluster: null（＝御利益は unknown。隠さず出す）

