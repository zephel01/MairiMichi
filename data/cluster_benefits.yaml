# MairiMichi 神格クラスタ → 御利益 マスタ v1
#
# なぜ主/副の重みが必要か:
#   主要な祭神はどれも6項目前後の御利益を持ち、五穀豊穣・商売繁盛・家内安全・
#   厄除け はほぼ全員が持っている。素直に全部付与すると全社寺が全カテゴリに
#   該当し、検索が機能しない（競合ホトカミの「1寺社に10タグ」問題）。
#
#   → primary は各クラスタ 1〜2個だけ。一覧の絞り込みは既定で primary のみ。
#     secondary は詳細ページで「このほか〜としても信仰されています」と表示し、
#     トグル「関連する御利益も含める」で検索対象に加える。
#
# 表現規約:
#   「◯◯の御利益があります」と断定しない。
#   「古くから◯◯の神として信仰されています」「◯◯と伝えられています」を使う。
#   UI には必ず導出根拠（どの祭神からか）を併記する。

version: 1
updated: 2026-08-31

# 御利益IDは benefits.yaml の minors.id を参照

mappings:
