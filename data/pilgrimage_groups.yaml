# MairiMichi 巡礼グループ v1（スキーマ定義とシード）
#
# 社寺は単体で参られるとは限らない。複数社寺がセットで信仰されている単位を
# 第一級のデータとして持ち、詳細ページの「備考」に表示する。
# v2 の「めぐりコース」（1日で回れるか）の基盤にもなる。
#
# データ源:
#   1. ja.Wikipedia Template:日本の寺院 の `札所等` パラメータ（最有用）
#   2. Wikidata / ja.Wikipedia の一覧記事（「三社参り」記事など）
#   3. 各巡礼の公式サイト（都七福神まいり、自治体観光協会など）
#   4. 手動
#
# 参考: ホトカミは巡礼を263件登録している（規模感の目安）

version: 1
updated: 2026-08-31

kinds:
  - id: fudasho
    label: 札所・霊場
    desc: 番号付きの巡礼路。四国八十八箇所、西国三十三所など
  - id: seven_gods
    label: 七福神めぐり
    desc: 全国に多数。多くは正月に集中して回る
  - id: three_shrines
    label: 三社参り
    desc: 地域ごとに定番ルートがある。正月の慣習として特に九州で盛ん
  - id: ichinomiya
    label: 諸国一之宮
    desc: 令制国ごとの一之宮
  - id: sandai
    label: 日本三大◯◯
    desc: 諸説あるものが多い。必ず「諸説あり」と付記する
  - id: local
    label: 地域独自の巡拝路

