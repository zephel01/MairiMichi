# ── 表示ルール ────────────────────────────────────────
display:
  section_title: 所属する巡り
  format: "{group_name}{order_suffix}"      # 例: 「四国八十八箇所 第51番札所」
  sandai_disclaimer: 諸説あり
  note: |
    「日本三大◯◯」は諸説あるものが多い。諸説ある場合は必ず「諸説あり」と
    付記し、可能なら出典を示すこと。断定しない。
